aid: validus-capital
name: Validus Capital
description: Validus is a Southeast Asian SME supply-chain and working-capital financing platform operated
  by Validus Investment Holdings Pte Ltd (UEN 201803167H), headquartered at Asia Square Tower 2 in Singapore
  and founded in 2015 to address the unmet financing needs of small and medium enterprises. The group
  runs country businesses across four markets — Batumbu (PT Berdayakan Usaha Indonesia) in Indonesia,
  Siam Validus in Thailand, Validus Vietnam, and, until April 2025, Validus Capital Pte Ltd in Singapore
  — offering invoice financing, purchase-order financing, vendor/supply-chain financing programs, working
  capital loans, SME business accounts and corporate cards funded by accredited and institutional investors.
  Validus Capital Pte Ltd, the Singapore subsidiary and the entity this profile is named for, was acquired
  outright by GXS Bank on 15 April 2025 and now trades as GXS Capital; the validus.sg domain redirects
  to the group site. The group has disbursed more than US$5 billion across its markets and has raised
  capital from Vertex Ventures, FMO, Citi, HSBC, Oikocredit and K3 Ventures. Validus publishes no public
  developer program, API reference or machine-readable API contract on any of its group or country domains.
